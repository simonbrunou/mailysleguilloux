name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # business-facts.test.js compares sitemap lastmod to git history
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
